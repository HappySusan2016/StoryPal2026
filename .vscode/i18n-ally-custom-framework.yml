# Recognize the t function returned by the custom hook and match only static string arguments.
languageIds:
  - javascript
  - javascriptreact
  - typescript
  - typescriptreact
usageMatchRegex:
  - "(?<![\\w$.])t\\s*\\(\\s*\"([^\"\\r\\n]+)\"\\s*\\)"
  - "(?<![\\w$.])t\\s*\\(\\s*'([^'\\r\\n]+)'\\s*\\)"
monopoly: true
